[tool.poetry]
name = "crypto-backtester"
version = "0.2.0"
description = "Quantitative Trading Research & Multi-Engine Validation"
authors = ["Ria Chawak <ria.chawak88@nmims.in>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pandas = "^2.2.3"
numpy = "^2.2.4"
pyarrow = "^21.0.0"
scipy = "^1.12.0"
statsmodels = "^0.14.0"
ta = "^0.11.0"
lightgbm = "^4.3.0"
scikit-learn = "^1.4.0"
tensorflow = "^2.16.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
tqdm = "^4.66.0"
python-docx = "^1.1.0"
nautilus_trader = "1.221.0"
backtesting = "^0.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
